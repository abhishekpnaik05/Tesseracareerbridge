services:
  - type: web
    name: tessera-backend
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && cd shared && pnpm build && cd ../database && pnpm build && cd ../server && pnpm build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: API_PREFIX
        value: /api/v1
      - key: SERVER_PORT
        value: 4000
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: ./storage/local
