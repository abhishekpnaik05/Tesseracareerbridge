services:
  postgres:
    image: postgres:16-alpine
    container_name: tcb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tessera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tessera_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-tesseracareerbridge}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tessera} -d ${POSTGRES_DB:-tesseracareerbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
